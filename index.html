        let currentDayIndex = 0;
        const tabsContainer = document.getElementById('date-tabs');
        const scheduleContainer = document.getElementById('schedule-container');

        function getTypeStyle(type) {
            switch(type) {
                case '交通': return 'bg-sky-100 text-sky-700 border-sky-200';
                case '美食': return 'bg-orange-100 text-orange-700 border-orange-200';
                case '景點': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                case '住宿': return 'bg-indigo-100 text-indigo-700 border-indigo-200';
                case '逛街': return 'bg-pink-100 text-pink-700 border-pink-200';
                default: return 'bg-slate-100 text-slate-700 border-slate-200';
            }
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            itineraryData.forEach((day, index) => {
                const isSelected = index === currentDayIndex;
                const btn = document.createElement('button');
                
                btn.className = `whitespace-nowrap px-5 py-2.5 rounded-full text-[15px] font-bold transition-all duration-200 shadow-sm ${
                    isSelected 
                    ? 'bg-slate-800 text-white shadow-md transform scale-105' 
                    : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'
                }`;
                btn.innerHTML = `${day.date} ${day.day}`;
                btn.onclick = () => {
                    currentDayIndex = index;
                    renderTabs();
                    renderSchedule();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderSchedule() {
            scheduleContainer.innerHTML = '';
            const dayData = itineraryData[currentDayIndex];
            
            if (dayData.events.length === 0) {
                scheduleContainer.innerHTML = '<div class="text-center text-slate-400 mt-12 py-8 bg-white rounded-2xl border border-slate-200 shadow-sm font-medium">本日尚無行程安排</div>';
                return;
            }

            const timelineWrapper = document.createElement('div');
            timelineWrapper.className = 'relative pt-3';

            dayData.events.forEach((event, index) => {
                const isLast = index === dayData.events.length - 1;
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'relative pl-9 mb-7';

                // 左側時間軸圓點與線條
                let timelineDecor = `
                    <div class="absolute left-[3px] top-2 w-3.5 h-3.5 bg-blue-500 rounded-full border-[3px] border-white shadow-md z-10"></div>
                `;
                if (!isLast) {
                    timelineDecor += `<div class="absolute left-[8.5px] top-4 bottom-[-35px] w-0.5 bg-slate-200 z-0"></div>`;
                }

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';
                
                // 卡片頭部 (時間, 圖示, 標題)
                const headerHtml = `
                    <div class="px-4 py-3 border-b border-slate-100 flex items-start gap-3 bg-white">
                        <div class="mt-0.5 text-[22px] leading-none">${event.icon || '📍'}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
                                <span class="text-[14px] font-black text-blue-600 font-mono tracking-tight">${event.time}</span>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded ${getTypeStyle(event.type)}">${event.type}</span>
                            </div>
                            <h3 class="text-[18px] font-black text-slate-800 leading-snug">${event.title}</h3>
                        </div>
                    </div>
                `;

                // 卡片內文 (MapCode, 提示細節, 下拉選單, 直顯攻略)
                let bodyHtml = '';
                let hasBody = event.mapcode || event.phone || event.memo || (event.details && event.details.length > 0) || event.fullGuide || event.directGuide;

                if (hasBody) {
                    bodyHtml += '<div class="px-4 pb-4 pt-3 bg-white">';
                    
                    if (event.memo) {
                        bodyHtml += `<p class="text-[15px] font-bold text-slate-600 mb-3 leading-relaxed border-l-4 border-amber-400 pl-3 bg-amber-50/50 py-1.5">${event.memo}</p>`;
                    }

                    if (event.mapcode || event.phone) {
                        bodyHtml += `<div class="flex flex-col gap-2 mb-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200 shadow-inner">`;
                        if (event.mapcode) {
                            bodyHtml += `
                                <div class="flex items-center text-[15px]">
                                    <span class="text-slate-400 mr-2">📍</span>
                                    <span class="font-bold text-slate-500 mr-2">MapCode:</span>
                                    <span class="font-black text-slate-800 tracking-wider bg-white px-2 py-0.5 rounded shadow-sm border border-slate-200 select-all">${event.mapcode}</span>
                                </div>
                            `;
                        }
                        if (event.phone) {
                            bodyHtml += `
                                <div class="flex items-center text-[15px] mt-0.5">
                                    <span class="text-slate-400 mr-2">📞</span>
                                    <span class="font-bold text-slate-500 mr-2">電話:</span>
                                    <span class="font-black text-slate-800 bg-white px-2 py-0.5 rounded shadow-sm border border-slate-200 select-all">${event.phone}</span>
                                </div>
                            `;
                        }
                        bodyHtml += `</div>`;
                    }

                    if (event.details && event.details.length > 0) {
                        bodyHtml += `<div class="bg-blue-50/50 border border-blue-100 rounded-xl p-3.5 space-y-2.5">`;
                        event.details.forEach(detail => {
                            bodyHtml += `<p class="text-[15px] font-bold text-slate-700 leading-relaxed">${detail}</p>`;
                        });
                        bodyHtml += `</div>`;
                    }
                    
                    // 導入手風琴下拉式選單 (Accordion) 放進完整攻略
                    if (event.fullGuide) {
                        bodyHtml += `
                            <details class="group mt-3 bg-slate-50 rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                                <summary class="p-3 font-bold text-slate-700 cursor-pointer bg-slate-100 hover:bg-slate-200 transition-colors flex justify-between items-center select-none text-[15px]">
                                    <span>📖 查看詳細攻略</span>
                                    <span class="transform group-open:rotate-180 transition-transform duration-200">▼</span>
                                </summary>
                                <div class="p-4 text-[14.5px] text-slate-600 space-y-3.5 leading-relaxed bg-white border-t border-slate-200">
                                    ${event.fullGuide}
                                </div>
                            </details>
                        `;
                    }
                    
                    // 導入直接顯示的內容區塊 (针对当南食堂等6个地点)
                    if (event.directGuide) {
                        bodyHtml += `
                            <div class="mt-3 p-4 text-[14.5px] text-slate-700 space-y-3.5 leading-relaxed bg-slate-50 border border-slate-200 rounded-xl shadow-sm">
                                ${event.directGuide}
                            </div>
                        `;
                    }
                    
                    bodyHtml += '</div>';
                }

                card.innerHTML = headerHtml + bodyHtml;
                itemDiv.innerHTML = timelineDecor;
                itemDiv.appendChild(card);
                timelineWrapper.appendChild(itemDiv);
            });
            
            scheduleContainer.appendChild(timelineWrapper);

            // 加入切換日期時的淡入動畫
            scheduleContainer.style.opacity = 0;
            scheduleContainer.style.transform = 'translateY(8px)';
            setTimeout(() => {
                scheduleContainer.style.transition = 'all 0.3s ease-out';
                scheduleContainer.style.opacity = 1;
                scheduleContainer.style.transform = 'translateY(0)';
            }, 20);
        }

        renderTabs();
        renderSchedule();
    </script>
